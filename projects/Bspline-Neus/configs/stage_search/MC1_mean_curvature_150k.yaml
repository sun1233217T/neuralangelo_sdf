# MC1: Mean curvature regularization with threshold and band.
# Uses normalized Laplacian (∇²f/|∇f|) as mean curvature proxy.
# Only penalizes H > threshold within |SDF| < band of the surface.
_parent_: projects/Bspline-Neus/configs/stage_search/D1_anchor_r1_500k.yaml

max_iter: 150000
validation_iter: 50000

model:
    object:
        bspline:
            hierarchical:
                refine_iters: [10000, 30000, 70000, 100000]

optim:
    sched:
        two_steps: [100000, 130000]

trainer:
    loss_weight:
        mean_curvature: 0.01
    mean_curvature_params:
        threshold: 20.0
        band: 0.05
