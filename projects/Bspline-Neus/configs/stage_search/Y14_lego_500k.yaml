# Y14: NeRF-synthetic lego, 500k full run.  Y13 at 150k: train 31.02 /
# test 27.77 — method confirmed on clean object-centric synthetic data.
# Data-informed schedule [40k,60k,100k,150k] (saturation analysis of Y6/Y7).
